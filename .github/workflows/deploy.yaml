name: Build, Scan & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional note for why this manual run was triggered'
        required: false
        default: 'Manual run'

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: sesbounce
  ECS_CLUSTER: dev
  ECS_SERVICE: ses-bounce-service
  ECS_TASK_FAMILY: ses-bounce
  FAIL_ON_SEVERITIES: "EXTREME"

jobs:

  # ---------------------------------------------------------------
  # STAGE 1: Build & Push
  # ---------------------------------------------------------------
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image_tag=${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          # DOCKER_BUILDKIT=0 avoids OCI image-index manifests, which
          # Amazon ECR's scanner cannot process.
          DOCKER_BUILDKIT=0 docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --pull .

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ---------------------------------------------------------------
  # STAGE 2: Scan
  # ---------------------------------------------------------------
  scan:
    name: Scan
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for ECR scan and check findings
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          MAX_WAIT=180
          INTERVAL=5
          ELAPSED=0
          SCAN_STATUS=""

          echo "Waiting for ECR scan on $ECR_REPOSITORY:$IMAGE_TAG ..."
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            SCAN_STATUS=$(aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION" \
              --query 'imageScanStatus.status' --output text 2>/dev/null) || true

            if [ "$SCAN_STATUS" = "COMPLETE" ]; then
              echo "Scan complete."
              break
            elif [ "$SCAN_STATUS" = "FAILED" ]; then
              echo "ECR scan failed to run. Blocking deploy."
              exit 1
            else
              echo "Scan status: ${SCAN_STATUS:-not started yet}, waiting ${INTERVAL}s... (${ELAPSED}s/${MAX_WAIT}s)"
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
            fi
          done

          if [ "$SCAN_STATUS" != "COMPLETE" ]; then
            echo "Timed out waiting for ECR scan to complete. Blocking deploy."
            exit 1
          fi

          FINDINGS_JSON=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" --output json) || true

          if [ -z "$FINDINGS_JSON" ]; then
            echo "Could not retrieve scan findings. Blocking deploy."
            exit 1
          fi

          echo "$FINDINGS_JSON" | jq '.imageScanFindings.findingSeverityCounts'

          BLOCK=0
          for SEV in $FAIL_ON_SEVERITIES; do
            COUNT=$(echo "$FINDINGS_JSON" | jq --arg SEV "$SEV" '.imageScanFindings.findingSeverityCounts[$SEV] // 0')
            echo "${SEV}: ${COUNT}"
            if [ "$COUNT" -gt 0 ]; then
              BLOCK=1
            fi
          done

          if [ "$BLOCK" -eq 1 ]; then
            echo "Vulnerabilities found at or above threshold (${FAIL_ON_SEVERITIES}). Blocking deploy."
            exit 1
          else
            echo "No vulnerabilities found at ${FAIL_ON_SEVERITIES} severity. Safe to deploy."
          fi

  # ---------------------------------------------------------------
  # STAGE 3: Deploy — only runs if Scan job succeeded
  # ---------------------------------------------------------------
 deploy:
    name: Deploy
    needs: [build-and-push, scan]
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -e

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Using image: $IMAGE_URI"

          echo "Getting latest task definition..."

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json

          echo "Updating image in task definition..."

          jq --arg IMAGE "$IMAGE_URI" '
            .containerDefinitions[0].image=$IMAGE |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
          ' task-definition.json > new-task-definition.json

          echo "Registering new task definition revision..."

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "New Task Definition: $TASK_DEF_ARN"

          echo "Updating ECS service..."

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --region "$AWS_REGION"

          echo "Waiting for deployment to complete..."

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

          echo "Deployment completed successfully."
